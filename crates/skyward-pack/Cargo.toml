[package]
name = "skyward-pack"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "skyward-pack"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { version = "4.5.51", features = ["derive"] }
sha2 = "0.10.9"
skyward-bootimg = { path = "../skyward-bootimg" }
skyward-config = { path = "../skyward-config" }
tempfile = "3.27.0"
# Takes the stock recovery partition out of a full update package on its
# server, reading only what that partition takes.
unpayload = { version = "0.1.1", default-features = false, features = ["http"] }
# Takes the stock recovery image itself from where a maker hands it out.
ureq = { version = "=3.5.0", default-features = false, features = ["rustls", "rustls-webpki-roots"] }

[dev-dependencies]
serde_json = "1.0.145"
