# OPPO A57 (16061, MSM8940 / Snapdragon 435).
#
# The phone is not A/B: it has one system and one recovery, on their own
# partitions, and the recovery is built on the LineageOS 22.1 recovery
# image, whose kernel is rebuilt from the 4.19 tree with the recovery
# fragment in it. Its bootloader reads a signature patch after the image,
# which travels on from the stock image.
#
# A57 and R9s need kernels of their own: their touchscreen drivers
# (Goodix GT5688 here, Synaptics S3320 on the R9s) export the same symbols
# and cannot be built into one kernel.

[device]
codename = "a57"
brand = "OPPO"
model = "OPPO A57"
# One system and one recovery, no slots.
ab = false
soc = { hans = "高通骁龙™ 435 移动平台", hant = "高通驍龍™ 435 行動平台", en = "Qualcomm Snapdragon 435" }

[display]
width = 720
height = 1280
density = 280
diagonal = 5.2

# The recovery's kernel carries every driver the phone needs built in, so
# there is nothing to load from the partitions.
[modules]
sources = []
load = []

# The WCNSS (Wi-Fi/Bluetooth) processor is booted by the kernel from a set
# of signed images (wcnss.mdt and its .b00..b12 segments) that live in the
# modem partition, which a recovery otherwise never mounts. Without them
# ueventd cannot answer the firmware request, pronto stays OFFLINING and no
# wlan0 is ever made.
[firmware]
partition = "modem"

# The WCNSS chip is an old prima/wcnss part: its WLAN driver is built into
# the kernel (there is no wlan.ko to load), and wpa_supplicant talks to it
# over WEXT rather than nl80211. wcnss_service (started below) opens
# /dev/wcnss_ctrl, which boots pronto and downloads the NV calibration
# image; the WLAN thread then waits for wlan0 and starts the supplicant.
[wlan]
modules = []
firmware = [
    # The NV image the kernel asks for by this subpath once pronto is up.
    # It lives under the board-id folders in the vendor partition, not where
    # the loader looks, so place it in the recovery's firmware folder.
    { name = "wlan/prima/WCNSS_qcom_wlan_nv.bin", path = "/vendor/firmware/wlan/16061/WCNSS_qcom_wlan_nv.bin" },
    { name = "wlan/prima/WCNSS_cfg.dat", path = "/vendor/firmware/wlan/prima/WCNSS_cfg.dat" },
    { name = "wlan/prima/WCNSS_wlan_dictionary.dat", path = "/vendor/firmware/wlan/prima/WCNSS_wlan_dictionary.dat" },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/system/lib64", "/vendor/lib64"]
driver = "wext"
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

# The stock recovery the image is built on: the LineageOS 22.1 recovery of
# the phone's own latest build, whose init, adbd, SELinux policy and
# libraries stay.
[stock]
version = "lineage-22.1-20260715"
image = "https://github.com/BlueyfishReleases/A57/releases/download/lineage-22.1-20260715-UNOFFICIAL-A57/recovery.img"
recovery = "4fb32feb0cea3f1b800a0ea014a45d15bab3dce10846914c32353e97b42d3959"

# The old prima/wcnss radio: this daemon opens /dev/wcnss_ctrl, boots the
# pronto processor from the images on the modem partition and downloads the
# NV calibration data. It has to run before anything asks for wlan0.
[[service]]
path = "/vendor/bin/wcnss_service"
libraries = ["/system/lib64", "/vendor/lib64"]
user = "root"
groups = ["root"]

# The directory the phone's hardware services register with. A recovery
# carries none of it — it is on the installed system's system partition,
# which the recovery mounts at /mnt/system — and without it nothing that
# speaks the older hardware interface can be found at all: every look-up
# answers that the service is not there.
[[service]]
path = "/system/bin/hwservicemanager"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_property = "hwservicemanager.ready"
user = "root"
groups = ["root"]

# The directory the vendor partition's own hardware services register
# with, which is a second one beside the rest of the phone's, and which the
# two services below register into. A recovery carries none of it either.
[[service]]
path = "/vendor/bin/vndservicemanager"
args = ["/dev/vndbinder"]
libraries = ["/system/lib64", "/vendor/lib64"]
user = "system"
groups = ["system", "readproc"]

# The secure world is reached from the system through these, and without
# them the data partition cannot be opened: the daemon below registers the
# listeners it calls back through, and the two services above it hold the
# keys and check screen locks. They are the phone's own programs, run as
# its own init runs them.
[[service]]
path = "/vendor/bin/qseecomd"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_property = "vendor.sys.listeners.registered"
user = "root"
groups = ["root", "drmrpc"]

[[service]]
path = "/vendor/bin/hw/android.hardware.keymaster@3.0-service"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_hardware_service = "android.hardware.keymaster@3.0::IKeymasterDevice/default"
user = "root"
groups = ["root"]

[[service]]
path = "/vendor/bin/hw/android.hardware.gatekeeper@1.0-service"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_hardware_service = "android.hardware.gatekeeper@1.0::IGatekeeper/default"
user = "root"
groups = ["root"]

# The partitions a backup of the baseband and EFS takes. The sensors'
# calibration is in persist.
[backup]
efs = ["modemst1", "modemst2", "fsg", "fsc", "persist"]

# Where the phone's own programs keep logs in the data partition; erasing
# keeps the folders and takes their files.
[wipe]
logs = [
    "/data/vendor/wifi",
    "/data/vendor/ramdump",
    "/data/vendor/ssrdump",
    "/data/vendor/tombstones",
    "/data/vendor/wlan_logs",
]

# What the image has to have for this phone's display to come up, beyond the
# stock recovery: the kernel's DTS leaves qcom,mdss_dsi@0's ext_byte0/byte1 and
# ext_pixel0/1 clocks pointing at the DSI PLLs instead of the gcc-mdss wrapper,
# so clk_set_rate answers -EINVAL and the panel stays dark once anything blanks
# it. The panel node also lacks the mi,* brightness maxima the UI reads.
# Both are dealt with in the kernel tree, not here.
